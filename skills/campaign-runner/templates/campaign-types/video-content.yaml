# Video Content Campaign Template (Option B Video Prompt-Pack Pipeline)
# Full pipeline: Research → creative-diversity map → concepts/hooks → AG1 → scripts/input-image plan/canonical prompt pack/adapters → AG2 → optional render → review
#
# RENDER SURFACE: Higgsfield CLI now; future external APIs later.
# Only approved render surfaces are listed here.
#
# AUTOMATION NOTE: Currently manual via Claude Code.
# Future automation target: trigger.dev / inngest / modal.com (NOT n8n)
#
# HITL GATES: AG1 concept/hook approval, AG2 prompt/input package approval, optional input/render approval, final video review

campaign:
  name: ""
  project: ""
  type: video-content
  created: ""
  phase: planning

status:
  last_session: ""
  last_action: "Campaign created from video-content template"
  next_actions:
    - "Research market awareness, buyer language, competitor videos, and style references"
    - "Load top-level 00_inputs, _brand/offer.md, _brand/icp.md, _brand/buyer-profile.md micro-personas, avatars, asset map, and video style"
    - "Read campaign-index.json and campaign-selection.json, create a video-concepts/<concept-slug>/ workspace with only a concept brief and selection manifest in 00_inputs, then run creative-diversity map before concepts"
  blockers: []

tasks:
  # --- RESEARCH PHASE (3 tasks) ---
  - id: competitor-scrape
    phase: research
    status: planned
    agent: researcher
    skill: deep-research
    description: "Competitor and market-awareness research — scrape top-performing video ads in niche, collect buyer language, classify awareness/sophistication, analyze hooks, pacing, visual style, CTAs, and claim-risk boundaries. Reference selected client inputs from campaign-selection.json; do not copy raw 00_inputs into concept folders"
    dependencies: []
    asset: 01_research/output/competitor-and-awareness-research.md

  - id: format-selection
    phase: research
    status: planned
    agent: planner
    skill: video-concept-lab
    description: "Select video concept routes, style profiles, target platform, audience temperature, product type, budget, likely render model family, top-level input paths, and buyer-profile.md micro-persona IDs. Keep this prompt-pack-first; no render call here. Record route in campaign-index.json, campaign-selection.json, and concept workspace pipeline-state.json"
    dependencies: [competitor-scrape]
    asset: video-concepts/<concept-slug>/01_strategy/video-concept-routes.md

  - id: character-setup
    phase: research
    status: planned
    agent: copywriter
    skill: avatar-research
    description: "Create or validate avatar/character hypotheses for recurring talent. Include customer avatar, performer notes, visual continuity needs, and reusable input-asset requirements"
    dependencies: []
    asset: 01_research/output/avatar-character-notes.md

  # --- CONCEPT + SCRIPT PHASE (5 tasks) ---
  - id: video-concept-lab
    phase: script
    status: planned
    agent: copywriter
    skill: video-concept-lab
    description: "Generate five Meta-first AI-video concepts from an approved creative-diversity map, score them, recommend one winner, draft hook direction, and list early image/style-sheet requirements. Each concept must cite selected top-level input paths and buyer-profile.md micro-persona IDs. Do not create scripts, canonical prompts, adapters, renders, or copied input folders here"
    dependencies: [format-selection, character-setup]
    asset: video-concepts/<concept-slug>/02_ag1-options/concepts-draft.json

  - id: hitl-concept-approval
    phase: script
    status: planned
    agent: ""
    skill: ""
    description: "Approval Gate 1 — approve concept direction, hook direction, strategy-map trace, recommended format, duration, and prompt/input preview stubs. AG1 does not approve rendering"
    dependencies: [video-concept-lab]
    hitl: true

  - id: script-visual-refinement
    phase: script
    status: planned
    agent: copywriter
    skill: script-skill
    description: "Post-AG1: refine approved concept into scripts-draft.json and script-pack.md. Lock final hook, script, scene logic, rendered-text/subtitle policy, acting/VO/music/SFX notes, and revised image/style-sheet implications. Keep source references as paths/IDs from campaign-selection.json and concept-brief.json"
    extra_skills: [copywriting, video-concept-lab]
    dependencies: [hitl-concept-approval]
    asset: video-concepts/<concept-slug>/03_scripts/scripts-draft.json

  - id: brief-pack
    phase: script
    status: planned
    agent: copywriter
    skill: video-brief-normalizer
    description: "Create the AG2 prompt/input package from the approved concept and scripts: input-image-plan, canonical-prompt-pack, model adapters, manual-run-guide, and approval-2.json pending. Use selected top-level inputs and buyer-profile.md micro-personas by reference. Do not create render jobs until AG2 is approved"
    dependencies: [script-visual-refinement]
    asset: video-concepts/<concept-slug>/05_prompt-packs/canonical-prompt-pack.json

  - id: hitl-brief-pack-approval
    phase: script
    status: planned
    agent: ""
    skill: ""
    description: "Approval Gate 2 — approve scripts, input-image plan, canonical prompt pack, manual guide, and model adapters. Rendering is optional and illegal before this gate"
    dependencies: [brief-pack]
    hitl: true

  # --- INPUT ASSET + PROMPT PHASE (3 tasks) ---
  - id: input-asset-plan
    phase: prompt
    status: planned
    agent: copywriter
    skill: video-factory
    description: "After Approval Gate 2, create or refine the input-asset manifest: brand/product assets, approved AI assets, scene-specific generated stills, beat-sheet PNGs, optional audio/video references, and proposed reference order for Higgsfield or another model adapter"
    dependencies: [hitl-brief-pack-approval]
    asset: video-concepts/<concept-slug>/04_input-images/input-image-plan.json

  - id: beat-sheet-and-render-prompts
    phase: prompt
    status: planned
    agent: copywriter
    skill: video-factory
    description: "Generate beat-sheet instructions and model-adapter prompts from the canonical prompt pack. Seedance/Higgsfield adapter must preserve canonical intent and reference ordering; non-Higgsfield adapters must not add claims or beats"
    dependencies: [input-asset-plan]
    asset: video-concepts/<concept-slug>/05_prompt-packs/model-adapters/

  - id: image-prompts
    phase: prompt
    status: planned
    agent: copywriter
    skill: image-generation
    description: "Generate image prompts for required input assets: product sheets, character sheets, style sheets, scene plates, start/end frames where the selected model needs them. Cross-image consistency checklist required"
    dependencies: [hitl-brief-pack-approval]
    asset: video-concepts/<concept-slug>/04_input-images/input-image-plan.md

  # --- GENERATION PHASE (3 tasks) ---
  - id: image-generation
    phase: generation
    status: planned
    agent: ""
    skill: image-generation
    description: "Generate required input images with the selected image tool. Batch review all input images before proceeding to beat sheets or video render"
    dependencies: [image-prompts]
    asset: video-concepts/<concept-slug>/04_input-images/generated-input-assets/

  - id: hitl-input-and-prompt-approval
    phase: generation
    status: planned
    agent: ""
    skill: ""
    description: "HITL gate — approve input images, beat sheets, reference ordering, and render prompts before any Higgsfield CLI call"
    dependencies: [image-generation, beat-sheet-and-render-prompts]
    hitl: true

  - id: video-generation
    phase: generation
    status: planned
    agent: ""
    skill: video-factory
    description: "Create renderRequest.json and flexible Higgsfield CLI command template from the approved prompt pack and input-asset manifest. Do not call the renderer until explicit approval"
    dependencies: [hitl-input-and-prompt-approval]
    asset: video-concepts/<concept-slug>/06_generation-runs/render-requests/

  - id: post-production
    phase: generation
    status: planned
    agent: ""
    skill: ""
    description: "Post-production pipeline after approved renders: assemble clips, add captions, music, CTA end cards, optional grain/upscale/audio. Preserve renderRequest and source prompt lineage"
    dependencies: [video-generation]
    asset: video-concepts/<concept-slug>/06_generation-runs/output/

  # --- REVIEW & PUBLISH PHASE (3 tasks) ---
  - id: hitl-video-review
    phase: review
    status: planned
    agent: ""
    skill: ""
    description: "HITL gate — final video review. Format: | # | Type | Duration | Platform | Thumbnail | Action |. Jerel approves/requests reshoots/cuts"
    dependencies: [post-production]
    hitl: true

  - id: schedule-publish
    phase: review
    status: planned
    agent: ""
    skill: social-media
    description: "Schedule approved videos via Postiz or upload to ad platform. Platform-specific specs check (aspect ratio, duration limits, file size)"
    dependencies: [hitl-video-review]
    published:
      platform: postiz

  - id: seed-library-update
    phase: review
    status: planned
    agent: ""
    skill: video-factory
    description: "Update video learnings with winning prompts, reference orders, input-asset combinations, render commands, and platform assignments"
    dependencies: [hitl-video-review]
    asset: 05_handoff/video-learnings.md

  # --- OPTIMIZATION PHASE (2 tasks) ---
  - id: campaign-audit
    phase: optimization
    status: planned
    agent: ""
    skill: paid-media-audit
    description: "After 7-14 days, run 7-step campaign audit. Key metric: unique outbound click rate. Classify ads: >3% scale, 1-3% optimize, <1% kill. Reference: client-campaign-audit.md"
    dependencies: [schedule-publish]
    asset: assets/reports/video-campaign-audit.md

  - id: feedback-loop
    phase: optimization
    status: planned
    agent: researcher
    skill: content-strategy
    description: "Identify winning hooks, best-performing types, optimal seeds. Update learnings.md, seed library, and character bibles. Feed insights into next batch cycle"
    dependencies: [campaign-audit]
    asset: assets/reports/video-learnings.md

assets: []

metrics:
  snapshots: []
