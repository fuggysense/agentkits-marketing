<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Whop Grabber</h1>

    <div id="status" class="status listening">
      <span class="dot"></span>
      <span id="status-text">Waiting for stream...</span>
    </div>

    <div id="url-display" class="url-display hidden">
      <code id="url-text"></code>
      <div class="timestamp" id="timestamp"></div>
    </div>

    <div id="manual-section" class="manual-section">
      <input type="text" id="manual-url" class="manual-input"
             placeholder="Paste .m3u8 URL here if auto-detect fails">
      <button id="btn-use-url" class="btn btn-ghost">Use this URL</button>
    </div>

    <div id="progress-section" class="progress-section hidden">
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div id="progress-text" class="progress-text">Starting...</div>
    </div>

    <div id="transcript-section" class="transcript-section hidden">
      <textarea id="transcript-text" class="transcript-text" readonly
                placeholder="Transcript will appear here..."></textarea>
    </div>

    <div class="actions">
      <button id="btn-transcribe" class="btn btn-primary" disabled>
        Transcribe Video
      </button>
      <button id="btn-copy" class="btn btn-secondary hidden">
        Copy Transcript to Clipboard
      </button>
      <button id="btn-download" class="btn btn-ghost" disabled>
        Download Video Only
      </button>
      <button id="btn-clear" class="btn btn-ghost" disabled>
        Clear
      </button>
    </div>

    <div id="toast" class="toast hidden">Copied!</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
